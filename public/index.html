<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>AICTE SecureMeet</title>

<script src="/socket.io/socket.io.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#07111f;
color:white;
}

button,input{
font:inherit;
}

button{
cursor:pointer;
border:0;
border-radius:9px;
padding:11px 15px;
font-weight:bold;
}

input{
padding:12px;
border-radius:9px;
border:1px solid #334155;
background:#0f172a;
color:white;
width:100%;
}

.hidden{
display:none!important;
}

.auth{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
background:#0f1b2d;
border:1px solid #26364c;
border-radius:18px;
padding:24px;
width:min(430px,100%);
}

h1{
margin-top:0;
}

.tabs{
display:flex;
gap:7px;
margin-bottom:20px;
}

.tabs button{
flex:1;
background:#1e293b;
color:white;
}

.tabs button.active{
background:#2563eb;
}

label{
display:block;
margin:13px 0;
font-size:14px;
font-weight:bold;
}

label input{
margin-top:7px;
}

.primary{
background:#2563eb;
color:white;
}

.green{
background:#16a34a;
color:white;
}

.red{
background:#dc2626;
color:white;
}

.secondary{
background:#334155;
color:white;
}

.dashboard{
min-height:100vh;
background:#f1f5f9;
color:#0f172a;
}

.nav{
height:65px;
background:#07111f;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
}

.content{
max-width:1100px;
margin:auto;
padding:25px 15px;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:15px;
}

.panel{
background:white;
border:1px solid #dce3ec;
border-radius:15px;
padding:20px;
}

.row{
display:flex;
gap:8px;
margin-top:10px;
}

.meeting{
border:1px solid #dce3ec;
padding:13px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
}

.room{
height:100vh;
display:flex;
flex-direction:column;
background:#020617;
}

.room-nav{
height:60px;
background:#0b1422;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
}

.room-body{
flex:1;
display:grid;
grid-template-columns:1fr 300px;
min-height:0;
}

.videos{
padding:10px;
display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(230px,1fr)
);
gap:10px;
overflow:auto;
}

.video{
position:relative;
background:#111827;
border-radius:12px;
overflow:hidden;
min-height:190px;
}

.video video{
width:100%;
height:100%;
min-height:190px;
object-fit:cover;
display:block;
}

.video .name{
position:absolute;
bottom:8px;
left:8px;
background:rgba(0,0,0,.7);
padding:5px 8px;
border-radius:6px;
font-size:12px;
}

.chat{
background:#0b1422;
border-left:1px solid #1e293b;
display:flex;
flex-direction:column;
}

.chat-title{
padding:15px;
font-weight:bold;
border-bottom:1px solid #1e293b;
}

.messages{
flex:1;
overflow:auto;
padding:12px;
}

.msg{
margin-bottom:12px;
font-size:13px;
}

.msg b{
color:#60a5fa;
display:block;
}

.chat-form{
display:flex;
gap:5px;
padding:8px;
border-top:1px solid #1e293b;
}

.controls{
height:72px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
background:#0b1422;
}

.control{
width:46px;
height:46px;
border-radius:50%;
background:#334155;
color:white;
padding:0;
}

.status{
padding:7px 10px;
background:#dcfce7;
color:#166534;
border-radius:999px;
font-size:12px;
font-weight:bold;
}

@media(max-width:750px){

.grid{
grid-template-columns:1fr;
}

.room-body{
grid-template-columns:1fr;
}

.chat{
display:none;
}

.videos{
grid-template-columns:1fr;
}

.meeting{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>


<!-- AUTH -->

<section
id="auth"
class="auth">

<div class="card">

<h1>🛡️ AICTE SecureMeet</h1>

<p>
Secure online meeting portal
</p>

<div class="tabs">

<button
id="adminTab"
class="active">
Admin
</button>

<button
id="participantTab">
Participant
</button>

</div>


<div id="adminForm">

<label>
Admin name

<input
id="adminName"
value="AICTE Administrator">
</label>

<label>
Admin email

<input
id="adminEmail"
type="email"
value="admin@aicte-securemeet.demo">
</label>

<label>
Password

<input
id="adminPassword"
type="password"
value="DemoPass123!">
</label>

<button
id="adminLogin"
class="primary"
style="width:100%">
Login as Admin
</button>

</div>


<div
id="participantForm"
class="hidden">

<label>
Your name

<input
id="participantName"
placeholder="Your name">
</label>

<label>
Email

<input
id="participantEmail"
type="email"
placeholder="friend@example.com">
</label>

<button
id="participantLogin"
class="primary"
style="width:100%">
Continue as Participant
</button>

</div>

</div>

</section>


<!-- DASHBOARD -->

<section
id="dashboard"
class="dashboard hidden">

<header class="nav">

<b>🛡️ AICTE SecureMeet</b>

<div>

<span id="userLabel"></span>

<button
id="logout"
class="secondary">
Logout
</button>

</div>

</header>


<main class="content">

<h1 id="welcome">
Welcome
</h1>

<div class="grid">


<div class="panel">

<h2>🎥 Meetings</h2>

<div
id="adminCreate">

<div class="row">

<input
id="meetingTitle"
placeholder="Meeting title"
value="AICTE Secure Meeting">

<button
id="createMeeting"
class="primary">
Start Meeting
</button>

</div>

</div>


<div
id="joinBox"
class="row">

<input
id="meetingId"
placeholder="Meeting ID">

<button
id="joinMeeting"
class="green">
Join
</button>

</div>


<div id="meetingList"></div>

</div>


<div class="panel">

<h2>🔐 Security</h2>

<p>
WebRTC media is exchanged directly
between participating browsers.
</p>

<p>
Camera and microphone permissions
are controlled by the browser.
</p>

<span class="status">
● ONLINE
</span>

</div>

</div>

</main>

</section>


<!-- ROOM -->

<section
id="room"
class="room hidden">

<header class="room-nav">

<div>

<b id="roomTitle">
AICTE Secure Meeting
</b>

<div id="roomId">
</div>

</div>

<button
id="leave"
class="red">
Leave
</button>

</header>


<div class="room-body">

<div
id="videos"
class="videos">
</div>


<aside class="chat">

<div class="chat-title">
💬 Meeting Chat
</div>

<div
id="messages"
class="messages">
</div>

<form
id="chatForm"
class="chat-form">

<input
id="chatInput"
placeholder="Message">

<button
class="primary">
Send
</button>

</form>

</aside>

</div>


<footer class="controls">

<button
id="mic"
class="control">
🎙️
</button>

<button
id="camera"
class="control">
📷
</button>

<button
id="screen"
class="control">
🖥️
</button>

</footer>

</section>


<script>

const socket =
io();

let user = null;

let meeting = null;

let localStream = null;

const peers = new Map();


const $ =
id => document.getElementById(id);


function show(id){

[
"auth",
"dashboard",
"room"
].forEach(
x => $(x).classList.add("hidden")
);

$(id).classList.remove("hidden");

}


/* AUTH TABS */

$("adminTab").onclick =
() => {

$("adminTab").classList.add("active");

$("participantTab").classList.remove("active");

$("adminForm").classList.remove("hidden");

$("participantForm").classList.add("hidden");

};


$("participantTab").onclick =
() => {

$("participantTab").classList.add("active");

$("adminTab").classList.remove("active");

$("participantForm").classList.remove("hidden");

$("adminForm").classList.add("hidden");

};


/* ADMIN */

$("adminLogin").onclick =
() => {

user = {

name:$("adminName").value ||
"Administrator",

email:$("adminEmail").value,

role:"Admin"

};

openDashboard();

};


/* PARTICIPANT */

$("participantLogin").onclick =
() => {

const name =
$("participantName").value.trim();

const email =
$("participantEmail").value.trim();

if(!name || !email){

alert("Enter name and email.");

return;

}

user = {

name,
email,
role:"Participant"

};

openDashboard();

};


/* DASHBOARD */

function openDashboard(){

show("dashboard");

$("welcome").textContent =
"Welcome, " + user.name;

$("userLabel").textContent =
user.role + " · " + user.email;


if(user.role === "Admin"){

$("adminCreate").classList.remove("hidden");

}else{

$("adminCreate").classList.add("hidden");

}


refreshMeetings();

}


function refreshMeetings(){

socket.emit(
"list-meetings",
list => {

const box =
$("meetingList");

if(!list.length){

box.innerHTML =
"<p>No live meetings.</p>";

return;

}


box.innerHTML =
list.map(m => `

<div class="meeting">

<div>

<b>${escapeHtml(m.id)}</b>

<div>
${escapeHtml(m.hostName)}
</div>

<small>
${m.participantCount}
participant(s)
</small>

</div>

<button
class="green"
onclick="join('${m.id}')">
Join
</button>

</div>

`).join("");

});

}


/* CREATE */

$("createMeeting").onclick =
() => {

socket.emit(
"create-meeting",
{
name:user.name
},
result => {

if(!result.ok){

alert("Could not create meeting.");

return;

}

join(
result.meetingId,
true
);

});

};


/* JOIN */

window.join =
function(id,isHost=false){

socket.emit(
"join-meeting",
{
meetingId:id,
name:user.name
},
async result => {

if(!result.ok){

alert(result.error);

return;

}

meeting = {

id:result.meetingId,

hostSocket:result.hostSocket,

isHost

};


await startRoom();

});

};


$("joinMeeting").onclick =
() => {

const id =
$("meetingId")
.value
.trim()
.toUpperCase();

if(id){

join(id);

}

};


/* ROOM */

async function startRoom(){

show("room");

$("roomId").textContent =
"Meeting ID: " + meeting.id;


$("roomTitle").textContent =
"AICTE Secure Meeting";


try{

localStream =
await navigator.mediaDevices
.getUserMedia({
video:true,
audio:true
});

addVideo(
socket.id,
localStream,
user.name
);


}catch(error){

alert(
"Camera/microphone permission is required for the live meeting."
);

}


/*
 * If participant already exists,
 * connect to the host.
 */

if(!meeting.isHost){

createPeer(
meeting.hostSocket,
true
);

}

}


/* PARTICIPANT ARRIVED */

socket.on(
"participant-joined",
async data => {

if(meeting &&
   meeting.isHost){

createPeer(
data.socketId,
false
);

}

});


/* CREATE PEER */

function createPeer(
target,
initiator
){

if(peers.has(target)){

return peers.get(target);

}


const pc =
new RTCPeerConnection({

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

});


peers.set(
target,
pc
);


if(localStream){

localStream
.getTracks()
.forEach(
track =>
pc.addTrack(
track,
localStream
)
);

}


pc.onicecandidate =
event => {

if(event.candidate){

socket.emit(
"ice-candidate",
{
target,
candidate:event.candidate
}
);

}

};


pc.ontrack =
event => {

const stream =
event.streams[0];

addVideo(
target,
stream,
"Participant"
);

};


if(initiator){

pc.createOffer()
.then(
offer =>
pc.setLocalDescription(
offer
)
)
.then(
() => {

socket.emit(
"offer",
{
target,
offer:pc.localDescription
}
);

});

}


return pc;

}


/* OFFER */

socket.on(
"offer",
async data => {

const pc =
createPeer(
data.sender,
false
);


await pc.setRemoteDescription(
data.offer
);


const answer =
await pc.createAnswer();


await pc.setLocalDescription(
answer
);


socket.emit(
"answer",
{
target:data.sender,
answer
}
);

});


/* ANSWER */

socket.on(
"answer",
async data => {

const pc =
peers.get(data.sender);

if(!pc){

return;

}

await pc.setRemoteDescription(
data.answer
);

});


/* ICE */

socket.on(
"ice-candidate",
async data => {

const pc =
peers.get(data.sender);

if(!pc){

return;

}

try{

await pc.addIceCandidate(
data.candidate
);

}catch(e){

console.error(e);

}

});


/* VIDEO */

function addVideo(
id,
stream,
name
){

let card =
document.getElementById(
"video-" + id
);


if(!card){

card =
document.createElement("div");

card.className =
"video";

card.id =
"video-" + id;


const video =
document.createElement("video");

video.autoplay = true;

video.playsInline = true;

if(id === socket.id){

video.muted = true;

}


video.srcObject =
stream;


const label =
document.createElement("div");

label.className =
"name";

label.textContent =
name;


card.appendChild(video);

card.appendChild(label);

$("videos")
.appendChild(card);

}else{

const video =
card.querySelector("video");

video.srcObject =
stream;

}

}


/* MIC */

$("mic").onclick =
() => {

if(!localStream){

return;

}

const tracks =
localStream.getAudioTracks();

tracks.forEach(
t => t.enabled = !t.enabled
);

};


/* CAMERA */

$("camera").onclick =
() => {

if(!localStream){

return;

}

const tracks =
localStream.getVideoTracks();

tracks.forEach(
t => t.enabled = !t.enabled
);

};


/* SCREEN SHARE */

$("screen").onclick =
async () => {

try{

const screen =
await navigator.mediaDevices
.getDisplayMedia({
video:true
});


const screenTrack =
screen.getVideoTracks()[0];


peers.forEach(
pc => {

const sender =
pc.getSenders()
.find(
s =>
s.track &&
s.track.kind === "video"
);

if(sender){

sender.replaceTrack(
screenTrack
);

}

});


screenTrack.onended =
async () => {

const cameraTrack =
localStream
.getVideoTracks()[0];

peers.forEach(
pc => {

const sender =
pc.getSenders()
.find(
s =>
s.track &&
s.track.kind === "video"
);

if(sender){

sender.replaceTrack(
cameraTrack
);

}

});

};

}catch(e){

console.log(e);

}

};


/* CHAT */

$("chatForm").onsubmit =
e => {

e.preventDefault();

const text =
$("chatInput")
.value
.trim();

if(!text){

return;

}

socket.emit(
"chat-message",
{
message:text
}
);

$("chatInput").value = "";

};


socket.on(
"chat-message",
data => {

const item =
document.createElement("div");

item.className =
"msg";

item.innerHTML =
`<b>${escapeHtml(data.sender)}</b>
${escapeHtml(data.message)}`;

$("messages")
.appendChild(item);

$("messages").scrollTop =
$("messages").scrollHeight;

});


/* LEAVE */

$("leave").onclick =
() => {

socket.emit(
"leave-meeting"
);

cleanup();

show("dashboard");

refreshMeetings();

};


/* PARTICIPANT LEFT */

socket.on(
"participant-left",
data => {

const pc =
peers.get(data.socketId);

if(pc){

pc.close();

peers.delete(
data.socketId
);

}


const video =
document.getElementById(
"video-" + data.socketId
);

if(video){

video.remove();

}

});


/* MEETING ENDED */

socket.on(
"meeting-ended",
() => {

alert(
"The Admin ended the meeting."
);

cleanup();

show("dashboard");

refreshMeetings();

});


/* LOGOUT */

$("logout").onclick =
() => {

cleanup();

user = null;

show("auth");

};


/* CLEANUP */

function cleanup(){

if(localStream){

localStream
.getTracks()
.forEach(
track =>
track.stop()
);

localStream = null;

}


peers.forEach(
pc =>
pc.close()
);

peers.clear();

$("videos").innerHTML = "";

meeting = null;

}


/* HTML ESCAPE */

function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
